name: Advisory OEE upstream drift

# Separate from blocking, immutable-pin validation. A changing upstream main
# must never remap a reviewed resource map or break the pinned guide gate.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  advisory:
    name: Compare reviewed pins with upstream OEE main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OEE Workspace
        uses: actions/checkout@v4
      - name: Checkout current upstream OEE main, including history
        uses: actions/checkout@v4
        with:
          repository: 0xbuffdev/open-engineering-education
          ref: main
          path: _oee
          persist-credentials: false
          fetch-depth: 0
      - name: Set up supported Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Select explicit comparison SHA
        id: upstream
        shell: bash
        run: |
          target="$(git -C _oee rev-parse --verify 'HEAD^{commit}')"
          echo "sha=$target" >> "$GITHUB_OUTPUT"
          echo "Compared upstream OEE main at $target"
      - name: Report drift without changing pinned maps
        id: drift
        shell: bash
        env:
          TARGET_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          result=0
          python scripts/report-oee-drift.py \
            --oee _oee --target-revision "$TARGET_SHA" \
            > oee-upstream-drift.json || result=$?
          echo "report_exit=$result" >> "$GITHUB_OUTPUT"
          {
            echo "## Advisory OEE source drift"
            echo ""
            echo "Target upstream commit: `$TARGET_SHA`"
            echo ""
            echo "The recorded source revision remains the validation and guide-generation authority."
            echo "No mapping, guide, curriculum file or learner evidence is modified."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -s oee-upstream-drift.json ]]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          data = json.loads(Path("oee-upstream-drift.json").read_text(encoding="utf-8"))
          print("| Course | Pin | Target | State | Changes | Resource risks |")
          print("| --- | --- | --- | --- | ---: | ---: |")
          for row in data["results"]:
              print(f"| {row['course']} | `{row['pinnedRevision'][:12]}` | "
                    f"`{row['targetRevision'][:12]}` | {row['state']} | "
                    f"{len(row['changes'])} | {len(row['resourceAssociationRisks'])} |")
          print("")
          if data["upstreamReviewRequired"]:
              print("**Human review is required before any deliberate map revision.**")
          else:
              print("No relevant canonical contract drift detected for these mapped courses.")
          print("This is structural, advisory evidence only; it is not educational approval.")
          PY
          else
            echo "The reporter returned code $result without a JSON report." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$result" == "3" ]]; then
            echo "::warning::Upstream comparison could not produce a supported pinned target export. Review JSON and source revisions."
          elif [[ "$result" != "0" ]]; then
            echo "::error::Could not validate the recorded pin or complete the advisory report (code $result)."
            exit 1
          fi
      - name: Preserve complete advisory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oee-upstream-drift
          path: oee-upstream-drift.json
          if-no-files-found: warn
          retention-days: 30
