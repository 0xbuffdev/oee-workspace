name: Validate resource mappings

on:
  push:
    paths:
      - "resources/**"
      - "tests/**"
      - "scripts/check-resources.py"
      - "scripts/render-resource-guides.py"
      - "scripts/new-course-workspace"
      - ".github/workflows/resources.yml"
  pull_request:
    paths:
      - "resources/**"
      - "tests/**"
      - "scripts/check-resources.py"
      - "scripts/render-resource-guides.py"
      - "scripts/new-course-workspace"
      - ".github/workflows/resources.yml"

jobs:
  resource-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workspace
        uses: actions/checkout@v4
      - name: Checkout OEE for unmapped course scaffolding
        uses: actions/checkout@v4
        with:
          repository: 0xbuffdev/open-engineering-education
          path: _oee
          persist-credentials: false
      - name: Validate catalogue only (no active v1 maps)
        run: python3 scripts/check-resources.py
      - name: Reject stale generated reading guides
        run: python3 scripts/render-resource-guides.py --check
      - name: Strict v2 shape and pinned export regression suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify unmapped scaffolding and preserve learner files
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/new-course-workspace
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          mkdir -p "$temp/learner" "$temp/other"
          OEE_REPO="$PWD/_oee" bash scripts/new-course-workspace SEF SEF1 "$temp/learner"
          plan="$temp/learner/notes/SEF/SEF1/reading-plan.md"
          log="$temp/learner/notes/SEF/SEF1/resources.md"
          test ! -e "$plan"
          printf '\nLearner-owned entry\n' >> "$log"
          if OEE_REPO="$PWD/_oee" bash scripts/new-course-workspace SEF SEF1 "$temp/learner"; then
            echo "ERROR: existing learner directories were overwritten" >&2
            exit 1
          fi
          grep -q "Learner-owned entry" "$log"
          OEE_REPO="$PWD/_oee" bash scripts/new-course-workspace SEF SEF2 "$temp/other"
          test ! -e "$temp/other/notes/SEF/SEF2/reading-plan.md"
          # Legacy source formats are not supported, even without a resource map.
          mkdir -p "$temp/legacy-oee/curriculum/SEF" "$temp/legacy-learner"
          printf '**Specification:** `v0.1.0`\n' > "$temp/legacy-oee/curriculum/SEF/SEF1.md"
          if OEE_REPO="$temp/legacy-oee" bash scripts/new-course-workspace SEF SEF1 "$temp/legacy-learner"; then
            echo "ERROR: legacy OEE format was accepted" >&2
            exit 1
          fi
          test ! -e "$temp/legacy-learner/notes/SEF/SEF1"
