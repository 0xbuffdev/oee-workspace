name: Validate OEE Workspace release contracts

on:
  pull_request:
    paths:
      - "resources/**"
      - "evidence/**"
      - "oee_workspace/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/resources.yml"
  push:
    paths:
      - "resources/**"
      - "evidence/**"
      - "oee_workspace/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/resources.yml"

permissions:
  contents: read

jobs:
  release-contracts:
    name: Current-only offline source, resource and evidence contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install JSON Schema contract test validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.23.0"
      - name: Validate public resource catalogue and all active release maps
        run: python scripts/check-resources.py
      - name: Reject unapproved or stale published guides
        run: python scripts/render-resource-guides.py --check
      - name: Test release v2 source, maps, no-clobber CLI and evidence
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate command-line argument surface (no Git source selectors)
        run: |
          python -m oee_workspace --help
          python -m oee_workspace doctor --help
          python -m oee_workspace evidence init --help
