name: Validate OEE Workspace contracts

on:
  push:
    paths:
      - "resources/**"
      - "evidence/**"
      - "oee_workspace/**"
      - "tests/**"
      - "scripts/check-resources.py"
      - "scripts/verify-oee-export.py"
      - "scripts/render-resource-guides.py"
      - ".github/workflows/resources.yml"
  pull_request:
    paths:
      - "resources/**"
      - "evidence/**"
      - "oee_workspace/**"
      - "tests/**"
      - "scripts/check-resources.py"
      - "scripts/verify-oee-export.py"
      - "scripts/render-resource-guides.py"
      - ".github/workflows/resources.yml"

permissions:
  contents: read

jobs:
  pinned-contracts:
    name: Pinned resource and evidence contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workspace
        uses: actions/checkout@v4
      - name: Checkout complete canonical OEE history
        uses: actions/checkout@v4
        with:
          repository: 0xbuffdev/open-engineering-education
          path: _oee
          persist-credentials: false
          fetch-depth: 0
      - name: Set up supported Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate all reviewed resource maps against exact source commits
        run: python scripts/check-resources.py --oee _oee
      - name: Reject stale generated reading guides
        run: python scripts/render-resource-guides.py --oee _oee --check
      - name: Install test-only JSON Schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.23.0"
      - name: Verify schemas, exact Toolkit exports, safe publishers and Python CLI
        run: python -m unittest discover -s tests -p "test_*.py" -v

  cli-portability:
    name: Python CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Workspace
        uses: actions/checkout@v4
      - name: Checkout complete canonical OEE history
        uses: actions/checkout@v4
        with:
          repository: 0xbuffdev/open-engineering-education
          path: _oee
          persist-credentials: false
          fetch-depth: 0
      - name: Set up supported Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Exercise offline doctor, scaffolding, evidence, status and export
        run: python -m unittest discover -s tests -p "test_cli.py" -v
      - name: Enforce negative AI and agent safety tests
        run: python -m unittest discover -s tests -p "test_ai_safety.py" -v
