name: Offline OEE export consumer contract

on:
  pull_request:
    paths:
      - "scripts/verify-oee-export.py"
      - "tests/test_toolkit_consumer.py"
      - ".github/workflows/toolkit-export-consumer.yml"
  push:
    branches: [main]
    paths:
      - "scripts/verify-oee-export.py"
      - "tests/test_toolkit_consumer.py"
      - ".github/workflows/toolkit-export-consumer.yml"

permissions:
  contents: read

jobs:
  consumer-contract:
    name: Strict export v1 consumer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Test independent consumer and negative revision/map cases
        run: python -m unittest discover -s tests -p 'test_toolkit_consumer.py' -v
