name: Workspace quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Markdown and shell checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.24.0

      - name: Validate generation scripts
        run: |
          bash -n scripts/new-course-workspace
          bash -n scripts/new-project-workspace
