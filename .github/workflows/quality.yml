name: Workspace quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Markdown and Python syntax
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.24.0

      - name: Validate current Python commands and library syntax
        run: |
          python3 -m py_compile oee_workspace/__main__.py oee_workspace/local.py oee_workspace/evidence.py
          python3 -m py_compile scripts/check-resources.py scripts/render-resource-guides.py scripts/verify-oee-export.py
          python3 -m oee_workspace --help
