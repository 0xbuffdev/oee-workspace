name: Independent Workspace release readiness

# Engineering acceptance only: disposable CI key/snapshot, never an official
# OEE release, Toolkit publication, learner-data upload or production cutover.
on:
  pull_request:
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "docs/**"
      - "oee_workspace/**"
      - "resources/**"
      - "evidence/**"
      - "scripts/**"
      - "oee-toolkit.lock.json"
      - "oee-release-requirements.txt"
      - "templates/**"
      - "tests/**"
      - ".github/workflows/release-readiness.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "docs/**"
      - "oee_workspace/**"
      - "resources/**"
      - "evidence/**"
      - "scripts/**"
      - "oee-toolkit.lock.json"
      - "oee-release-requirements.txt"
      - "templates/**"
      - "tests/**"
      - ".github/workflows/release-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-offline-smoke:
    name: Signed disposable release and Git-free CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout exact Workspace source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout OEE public source at full fixture history
        uses: actions/checkout@v4
        with:
          repository: 0xbuffdev/open-engineering-education
          path: _oee
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install reviewed Toolkit and signature verifier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p fixture-wheels
          gh release download toolkit-v0.2.0 --repo 0xbuffdev/open-engineering-education --dir fixture-wheels --pattern 'oee_toolkit-0.2.0-py3-none-any.whl'
          python -c "import hashlib,pathlib; assert hashlib.sha256(pathlib.Path('fixture-wheels/oee_toolkit-0.2.0-py3-none-any.whl').read_bytes()).hexdigest() == '933d82a09f8ca01930a9a4e76b1bb399f2d10a940783a3bc6a39e7b5e9dc46f3'"
          python -I -m pip download --only-binary=:all: --require-hashes -r oee-release-requirements.txt --dest fixture-wheels
          python -I -m pip install --no-index --find-links fixture-wheels --only-binary=:all: --require-hashes -r oee-release-requirements.txt
          python -I -m pip install --no-index --no-deps fixture-wheels/oee_toolkit-0.2.0-py3-none-any.whl
          python -I -m pip check
      - name: Exercise disposable Ed25519-signed release and offline learner path
        shell: bash
        env:
          SMOKE_REPORT: ${{ runner.temp }}/oee-workspace-release-v2.json
        run: |
          python scripts/verify-external-workspace.py \
            --workspace-source . --oee-source _oee --report "$SMOKE_REPORT"
      - name: Preserve platform-specific JSON-only acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-release-v2-${{ matrix.os }}
          path: ${{ runner.temp }}/oee-workspace-release-v2.json
          if-no-files-found: warn
          retention-days: 30
