name: Independent Workspace release readiness

# Engineering acceptance only: disposable CI key/snapshot, never an official
# OEE release, Toolkit publication, learner-data upload or production cutover.
on:
  pull_request:
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "docs/**"
      - "oee_workspace/**"
      - "resources/**"
      - "evidence/**"
      - "scripts/**"
      - "oee-toolkit.lock.json"
      - "oee-release-requirements.txt"
      - "templates/**"
      - "tests/**"
      - ".github/workflows/release-readiness.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "docs/**"
      - "oee_workspace/**"
      - "resources/**"
      - "evidence/**"
      - "scripts/**"
      - "oee-toolkit.lock.json"
      - "oee-release-requirements.txt"
      - "templates/**"
      - "tests/**"
      - ".github/workflows/release-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-offline-smoke:
    name: Signed disposable release and Git-free CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout exact Workspace source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout OEE public source at full fixture history
        uses: actions/checkout@v4
        with:
          repository: 0xbuffdev/open-engineering-education
          path: _oee
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create clean verification environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .verification-venv
          if [ "$RUNNER_OS" = Windows ]; then
            echo "VERIFY_PYTHON=$GITHUB_WORKSPACE/.verification-venv/Scripts/python.exe" >> "$GITHUB_ENV"
          else
            echo "VERIFY_PYTHON=$GITHUB_WORKSPACE/.verification-venv/bin/python" >> "$GITHUB_ENV"
          fi
      - name: Install reviewed Toolkit and signature verifier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p fixture-wheels
          version=$("$VERIFY_PYTHON" -I scripts/run-pinned-toolkit.py --selected-version)
          wheel="oee_toolkit-$version-py3-none-any.whl"
          gh release download "toolkit-v$version" --repo 0xbuffdev/open-engineering-education --dir fixture-wheels --pattern "$wheel"
          "$VERIFY_PYTHON" -I scripts/run-pinned-toolkit.py --verify-wheel "fixture-wheels/$wheel"
          "$VERIFY_PYTHON" -I -m pip download --only-binary=:all: --require-hashes -r oee-release-requirements.txt --dest fixture-wheels
          "$VERIFY_PYTHON" -I -m pip install --no-index --find-links fixture-wheels --only-binary=:all: --require-hashes -r oee-release-requirements.txt
          "$VERIFY_PYTHON" -I -m pip install --no-index --no-deps "fixture-wheels/$wheel"
          "$VERIFY_PYTHON" -I -m pip check
      - name: Exercise disposable Ed25519-signed release and offline learner path
        shell: bash
        env:
          SMOKE_REPORT: ${{ runner.temp }}/oee-workspace-release-v2.json
        run: |
          "$VERIFY_PYTHON" scripts/verify-external-workspace.py \
            --workspace-source . --oee-source _oee --report "$SMOKE_REPORT"
      - name: Preserve platform-specific JSON-only acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-release-v2-${{ matrix.os }}
          path: ${{ runner.temp }}/oee-workspace-release-v2.json
          if-no-files-found: warn
          retention-days: 30
